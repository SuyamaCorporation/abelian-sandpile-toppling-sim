<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abelian Sandpile Model Toppling Simulation</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen flex flex-col items-center justify-center p-4">
<h1 class="text-2xl font-bold text-white mb-2">⏳ Abelian Sandpile Model</h1>
<p class="text-gray-400 text-sm mb-4">Click to drop grains. When a cell has ≥4 grains, it topples!</p>

<div class="flex flex-col items-center gap-4">
  <canvas id="canvas" width="500" height="500" class="rounded-xl shadow-2xl cursor-crosshair border-2 border-gray-700"
    style="image-rendering:pixelated" aria-label="Sandpile simulation canvas"></canvas>

  <div class="bg-gray-800 rounded-xl p-4 w-full max-w-lg">
    <div class="grid grid-cols-2 gap-4 mb-4">
      <div>
        <label class="text-gray-300 text-sm block mb-1">Speed: <span id="speedVal">100</span> steps/frame</label>
        <input type="range" id="speed" min="1" max="500" value="100" class="w-full" aria-label="Simulation speed">
      </div>
      <div>
        <label class="text-gray-300 text-sm block mb-1">Drop amount: <span id="dropVal">1000</span></label>
        <input type="range" id="dropAmt" min="100" max="50000" step="100" value="1000" class="w-full" aria-label="Grains to drop">
      </div>
    </div>
    <div class="flex flex-wrap gap-2 justify-center">
      <button onclick="resetGrid()" class="bg-red-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-red-700">Reset</button>
      <button onclick="togglePause()" id="pauseBtn" class="bg-yellow-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-yellow-700">Pause</button>
      <button onclick="toggleContinuousDrop()" id="contBtn" class="bg-purple-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-purple-700">Continuous Drop</button>
      <button onclick="dropCenter()" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-blue-700">Drop at Center</button>
    </div>
    <div class="mt-3 text-center">
      <span id="stats" class="text-gray-400 text-sm"></span>
    </div>
    <div class="mt-2 flex flex-wrap gap-x-4 gap-y-1 justify-center text-xs text-gray-400">
      <span class="flex items-center gap-1"><span style="background:#000;width:12px;height:12px;display:inline-block;border:1px solid #555"></span>0 grains</span>
      <span class="flex items-center gap-1"><span style="background:#1d4ed8;width:12px;height:12px;display:inline-block"></span>1 grain</span>
      <span class="flex items-center gap-1"><span style="background:#16a34a;width:12px;height:12px;display:inline-block"></span>2 grains</span>
      <span class="flex items-center gap-1"><span style="background:#ca8a04;width:12px;height:12px;display:inline-block"></span>3 grains</span>
      <span class="flex items-center gap-1"><span style="background:#dc2626;width:12px;height:12px;display:inline-block"></span>≥4 (toppling)</span>
    </div>
  </div>
</div>
<script>
const CANVAS_SIZE = 500;
const N = 125; // grid size (125x125 cells, each 4px)
const CELL = CANVAS_SIZE / N;

let grid, unstable, paused = false, continuousDrop = false;
let totalGrains = 0, totalTopples = 0;
let animId = null;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const COLORS = ['#000000','#1d4ed8','#16a34a','#ca8a04','#dc2626','#dc2626'];

function initGrid() {
  grid = new Uint8Array(N * N);
  unstable = new Set();
  totalGrains = 0; totalTopples = 0;
  render();
}

function addGrains(r, c, amount) {
  if (r < 0 || r >= N || c < 0 || c >= N) return;
  const idx = r * N + c;
  const oldVal = grid[idx];
  grid[idx] = Math.min(255, grid[idx] + amount);
  totalGrains += amount;
  if (grid[idx] >= 4) unstable.add(idx);
}

function toppleStep(stepsPerFrame) {
  for (let s = 0; s < stepsPerFrame; s++) {
    if (unstable.size === 0) return;
    const toTopple = [...unstable];
    unstable.clear();
    for (const idx of toTopple) {
      if (grid[idx] < 4) continue;
      const r = Math.floor(idx / N), c = idx % N;
      const drop = Math.floor(grid[idx] / 4);
      grid[idx] -= drop * 4;
      totalTopples += drop;
      if (grid[idx] >= 4) unstable.add(idx);
      const neighbors = [
        r > 0 ? idx-N : -1,
        r < N-1 ? idx+N : -1,
        c > 0 ? idx-1 : -1,
        c < N-1 ? idx+1 : -1
      ];
      for (const nidx of neighbors) {
        if (nidx < 0) continue;
        grid[nidx] += drop;
        if (grid[nidx] >= 4) unstable.add(nidx);
      }
    }
  }
}

function render() {
  const imageData = ctx.createImageData(CANVAS_SIZE, CANVAS_SIZE);
  const data = imageData.data;
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const v = Math.min(grid[r * N + c], 5);
      const col = COLORS[v];
      const R = parseInt(col.slice(1,3),16);
      const G = parseInt(col.slice(3,5),16);
      const B = parseInt(col.slice(5,7),16);
      for (let py = 0; py < CELL; py++) {
        for (let px = 0; px < CELL; px++) {
          const pixIdx = ((r * CELL + py) * CANVAS_SIZE + (c * CELL + px)) * 4;
          data[pixIdx] = R; data[pixIdx+1] = G; data[pixIdx+2] = B; data[pixIdx+3] = 255;
        }
      }
    }
  }
  ctx.putImageData(imageData, 0, 0);
  document.getElementById('stats').textContent = `Grains: ${totalGrains.toLocaleString()} | Topples: ${totalTopples.toLocaleString()} | Unstable: ${unstable.size}`;
}

let frameCount = 0;
function loop() {
  if (!paused) {
    const speed = parseInt(document.getElementById('speed').value);
    if (continuousDrop && frameCount % 5 === 0) {
      dropCenter();
    }
    toppleStep(speed);
    render();
    frameCount++;
  }
  animId = requestAnimationFrame(loop);
}

canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const c = Math.floor(x / rect.width * N);
  const r = Math.floor(y / rect.height * N);
  const amount = parseInt(document.getElementById('dropAmt').value);
  addGrains(r, c, amount);
});

document.getElementById('speed').addEventListener('input', e => {
  document.getElementById('speedVal').textContent = e.target.value;
});
document.getElementById('dropAmt').addEventListener('input', e => {
  document.getElementById('dropVal').textContent = parseInt(e.target.value).toLocaleString();
});

function resetGrid() { initGrid(); continuousDrop = false; document.getElementById('contBtn').classList.remove('ring-2','ring-purple-300'); }
function togglePause() {
  paused = !paused;
  document.getElementById('pauseBtn').textContent = paused ? 'Resume' : 'Pause';
}
function toggleContinuousDrop() {
  continuousDrop = !continuousDrop;
  document.getElementById('contBtn').classList.toggle('ring-2', continuousDrop);
  document.getElementById('contBtn').classList.toggle('ring-purple-300', continuousDrop);
}
function dropCenter() { addGrains(Math.floor(N/2), Math.floor(N/2), parseInt(document.getElementById('dropAmt').value)); }

initGrid();
// Add some initial grains to make it interesting
addGrains(Math.floor(N/2), Math.floor(N/2), 5000);
loop();
</script>
</body>
</html>
